<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HBV Liver Assessment Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4">

    <div class="bg-slate-900 p-6 rounded-2xl shadow-2xl w-full max-w-3xl border border-slate-700 grid grid-cols-1 lg:grid-cols-2 gap-8">
        
        <div class="space-y-4">
            <h2 class="text-2xl font-bold text-blue-400">HBV Liver Assessment Tool</h2>
            <form action="/predict" method="post" class="space-y-3">
                
                <input type="number" name="Age" value="{{ form_data.get('Age', '') }}" placeholder="Patient Age" class="w-full bg-slate-800 p-2.5 rounded-lg border border-slate-700 text-sm focus:border-blue-500 outline-none" required>
                
                <div class="grid grid-cols-2 gap-3">
                    <select name="Gender" class="w-full bg-slate-800 p-2.5 rounded-lg border border-slate-700 text-sm">
                        <option value="1" {% if form_data.get('Gender') == '1' %}selected{% endif %}>Male</option>
                        <option value="0" {% if form_data.get('Gender') == '0' %}selected{% endif %}>Female</option>
                    </select>
                    <select name="Blood Group" class="w-full bg-slate-800 p-2.5 rounded-lg border border-slate-700 text-sm">
                        {% for i, grp in [('0','A+'), ('1','A-'), ('2','B+'), ('3','B-'), ('4','O+'), ('5','O-'), ('6','AB+'), ('7','AB-')] %}
                        <option value="{{ i }}" {% if form_data.get('Blood Group') == i %}selected{% endif %}>{{ grp }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                {% for col in ['Total Anti-HBc', 'IgM Anti-HBc', 'HBeAg', 'Anti-HBe', 'HCV', 'HIV'] %}
                <div class="grid grid-cols-2 items-center gap-2">
                    <label class="text-[11px] font-semibold text-slate-400 uppercase">{{ col }}</label>
                    <select name="{{ col }}" class="bg-slate-800 p-2 rounded-lg border border-slate-700 text-sm">
                        <option value="1" {% if form_data.get(col) == '1' %}selected{% endif %}>Positive</option>
                        <option value="0" {% if form_data.get(col) == '0' %}selected{% endif %}>Negative</option>
                    </select>
                </div>
                {% endfor %}
                
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 py-3 rounded-xl font-bold text-sm transition">Run Prediction</button>
            </form>
        </div>

        <div class="flex flex-col justify-center items-center bg-slate-950 rounded-xl p-6 border border-slate-800 min-h-[250px]">
            {% if status %}
                <div class="text-center w-full animate-in fade-in duration-700">
                    <p class="text-slate-500 text-xs uppercase tracking-widest mb-4">Analysis Result</p>
                    <div class="bg-slate-800 p-4 rounded-xl border border-blue-500/30 mb-4">
                        <p class="text-[10px] text-blue-400 mb-0.5">STATUS</p>
                        <p class="text-xl font-bold">{{ status }}</p>
                    </div>
                    <div class="bg-slate-800 p-4 rounded-xl border border-emerald-500/30">
                        <p class="text-[10px] text-emerald-400 mb-0.5">CONFIDENCE</p>
                        <p class="text-xl font-bold">{{ confidence }}</p>
                    </div>
                </div>
            {% else %}
                <div class="text-center text-slate-600 text-sm">
                    <p>Enter data and click</p>
                    <p class="font-bold text-slate-500 mt-1">"Run Prediction"</p>
                </div>
            {% endif %}
        </div>
    </div>
</body>
</html>
